<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menus · القوائم — Holiday Inn Jeddah Corniche</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#145A3C">
  <link rel="icon" href="roshan/icon-192.png" type="image/png">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    body { background: var(--c-primary); color: #fff; min-height: 100dvh; display: grid; place-items: center; padding: 2rem 1.25rem; }
    main { width: min(100%, 26rem); display: grid; gap: 1.5rem; text-align: center; }
    h1 { font-weight: 300; font-size: 1.9rem; line-height: 1.2; }
    h1 span { display: block; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
    a.outlet {
      display: grid; gap: .1rem; padding: 1rem 1.25rem; border-radius: 14px;
      background: #fff; color: var(--c-primary-deep); text-decoration: none;
    }
    a.outlet strong { font-size: 1.15rem; }
    a.outlet span { font-size: .85rem; color: var(--c-muted); }
    footer { font-size: .8rem; opacity: .75; }
  </style>
</head>
<body>
  <main>
    <h1><span lang="ar" dir="rtl">قوائم الطعام</span>Our menus</h1>
    <ul>
      <li><a class="outlet" href="roshan/"><strong lang="ar" dir="rtl">مطعم روشن</strong><strong>Roshan Restaurant</strong><span>All-day dining</span></a></li>
      <!-- Add a line per outlet, e.g.
      <li><a class="outlet" href="moood/"><strong>Moood</strong><span>Coffee</span></a></li> -->
    </ul>
    <footer>Holiday Inn Jeddah Corniche · هوليداي إن كورنيش جدة</footer>
  </main>
</body>
</html>
